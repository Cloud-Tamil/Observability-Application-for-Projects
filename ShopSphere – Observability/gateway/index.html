<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ShopSphere</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
            color: #cbd5e1;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        button {
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            font-weight: 600;
        }

        button:hover {
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        pre {
            background: #111827;
            color: #e5e7eb;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            min-height: 150px;
        }

        .status {
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>ShopSphere</h1>
    <p>Production-style Docker Microservices Demo</p>
</header>

<main>

    <div class="card">

        <div class="status">
            Application Status:
            <span id="status">Ready</span>
        </div>

        <div class="actions">

            <button onclick="loadProducts()">
                Products
            </button>

            <button onclick="loadUsers()">
                Users
            </button>

            <button onclick="createOrder()">
                Create Order
            </button>

            <button onclick="loadOrders()">
                Orders
            </button>

        </div>

        <h3>API Response</h3>

        <pre id="output">Ready.</pre>

    </div>

</main>

<script>

async function request(url, options = {}) {

    document.getElementById("status").textContent = "Loading...";

    try {

        const response = await fetch(url, options);

        const data = await response.json();

        document.getElementById("output").textContent =
            JSON.stringify(data, null, 2);

        document.getElementById("status").textContent =
            response.ok ? "Success" : "Failed";

    } catch (error) {

        document.getElementById("output").textContent =
            error.toString();

        document.getElementById("status").textContent =
            "Error";
    }
}

function loadProducts() {

    request("/api/products");
}

function loadUsers() {

    request("/api/users");
}

function loadOrders() {

    request("/api/orders");
}

function createOrder() {

    request("/api/orders", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            userId: 1,
            productId: 1,
            quantity: 1
        })
    });
}

</script>

</body>
</html>
