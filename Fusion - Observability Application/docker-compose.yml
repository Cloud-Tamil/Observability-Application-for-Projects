name: fusion-metrics

x-app-env: &app-env
  FUSION_ENVIRONMENT: local
  FUSION_LOG_LEVEL: INFO
  FUSION_VERSION: "2.0.0"
  FUSION_JWT_SECRET: ${FUSION_JWT_SECRET:-please-change-me}
  FUSION_BOOTSTRAP_ADMIN_USER: ${FUSION_BOOTSTRAP_ADMIN_USER:-admin}
  FUSION_BOOTSTRAP_ADMIN_PASSWORD: ${FUSION_BOOTSTRAP_ADMIN_PASSWORD:-admin123}
  FUSION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fusion}:${POSTGRES_PASSWORD:-fusion}@postgres:5432/${POSTGRES_DB:-fusion}
  FUSION_REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fusion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fusion}
      POSTGRES_DB: ${POSTGRES_DB:-fusion}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fusion} -d ${POSTGRES_DB:-fusion}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [observability]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [observability]

  app:
    build: { context: ., dockerfile: Dockerfile }
    image: fusion-metrics:local
    environment: *app-env
    expose: ["8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped
    networks: [observability]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8000:80"]
    depends_on: [app]
    networks: [observability]

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    networks: [observability]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]
    networks: [observability]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_LEVEL: warn
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3001:3000"]
    depends_on: [prometheus]
    networks: [observability]

networks:
  observability: { driver: bridge }

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
