worker_processes auto;
events { worker_connections 2048; }
http {
    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
      '"method":"$request_method","uri":"$request_uri","status":$status,'
      '"rt":$request_time,"req_id":"$http_x_request_id"}';
    access_log /dev/stdout json_combined;
    upstream fusion_app { server app:8000; keepalive 32; }
    server {
        listen 80;
        location = /metrics  { proxy_pass http://fusion_app/metrics; }
        location = /health/live { proxy_pass http://fusion_app/health/live; access_log off; }
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_set_header Connection "";
            proxy_pass http://fusion_app;
        }
    }
}
