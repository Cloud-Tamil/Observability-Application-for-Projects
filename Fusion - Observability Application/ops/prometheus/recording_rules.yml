groups:
  - name: fusion-slo-recordings
    interval: 30s
    rules:
      - record: job:fusion_request_rate:5m
        expr: sum(rate(fusion_http_requests_total[5m])) by (job)
      - record: job:fusion_error_rate:5m
        expr: |
          sum(rate(fusion_http_requests_total{status_code=~"5.."}[5m])) by (job)
          / clamp_min(sum(rate(fusion_http_requests_total[5m])) by (job), 0.001)
      - record: job:fusion_latency_p95:5m
        expr: |
          histogram_quantile(0.95,
            sum(rate(fusion_http_request_duration_seconds_bucket[5m])) by (job, le))
      - record: job:fusion_slo_availability:5m
        expr: |
          sum(rate(fusion_slo_requests_total{class="good"}[5m])) by (job)
          / clamp_min(sum(rate(fusion_slo_requests_total[5m])) by (job), 0.001)
      - record: job:fusion_slo_burn_rate:5m
        expr: |
          (1 - (sum(rate(fusion_slo_requests_total{class="good"}[5m])) by (job)
                / clamp_min(sum(rate(fusion_slo_requests_total[5m])) by (job), 0.001)))
          / (1 - 0.999)
      - record: job:fusion_slo_burn_rate:1h
        expr: |
          (1 - (sum(rate(fusion_slo_requests_total{class="good"}[1h])) by (job)
                / clamp_min(sum(rate(fusion_slo_requests_total[1h])) by (job), 0.001)))
          / (1 - 0.999)
