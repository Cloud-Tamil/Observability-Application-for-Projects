global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: fusion-local
    environment: local

rule_files:
  - /etc/prometheus/recording_rules.yml
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: fusion-metrics
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["app:8000"]
        labels: { service: fusion-metrics, component: api }
