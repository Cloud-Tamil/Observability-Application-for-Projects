version: '3.9'

networks:
  shopsphere:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  prometheus_data:
  grafana_data:
  jenkins_data:

services:
  # ------------------- DATABASES -------------------
  mongo:
    image: mongo:6
    container_name: shopsphere-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - shopsphere

  redis:
    image: redis:7-alpine
    container_name: shopsphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - shopsphere

  # ------------------- MICROSERVICES -------------------
  auth-service:
    build: ./auth-service
    container_name: shopsphere-auth
    restart: unless-stopped
    environment:
      - PORT=4001
      - MONGO_URI=mongodb://mongo:27017/authdb
      - JWT_SECRET=supersecretjwtkey
      - JWT_EXPIRES=1d
    depends_on:
      - mongo
    ports:
      - "4001:4001"
    networks:
      - shopsphere

  user-service:
    build: ./user-service
    container_name: shopsphere-user
    restart: unless-stopped
    environment:
      - PORT=4002
      - MONGO_URI=mongodb://mongo:27017/userdb
      - JWT_SECRET=supersecretjwtkey
    depends_on:
      - mongo
      - auth-service
    ports:
      - "4002:4002"
    networks:
      - shopsphere

  order-service:
    build: ./order-service
    container_name: shopsphere-order
    restart: unless-stopped
    environment:
      - PORT=4003
      - MONGO_URI=mongodb://mongo:27017/orderdb
      - JWT_SECRET=supersecretjwtkey
    depends_on:
      - mongo
      - auth-service
    ports:
      - "4003:4003"
    networks:
      - shopsphere

  api-gateway:
    build: ./api-gateway
    container_name: shopsphere-gateway
    restart: unless-stopped
    environment:
      - PORT=8080
      - AUTH_SERVICE_URL=http://auth-service:4001
      - USER_SERVICE_URL=http://user-service:4002
      - ORDER_SERVICE_URL=http://order-service:4003
    depends_on:
      - auth-service
      - user-service
      - order-service
    ports:
      - "8080:8080"
    networks:
      - shopsphere

  frontend:
    build: ./frontend
    container_name: shopsphere-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "3000:80"
    networks:
      - shopsphere

  # ------------------- DEVOPS -------------------
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: shopsphere-jenkins
    restart: unless-stopped
    user: root
    privileged: true
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - shopsphere

  prometheus:
    image: prom/prometheus:latest
    container_name: shopsphere-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - shopsphere

  grafana:
    image: grafana/grafana:latest
    container_name: shopsphere-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - shopsphere