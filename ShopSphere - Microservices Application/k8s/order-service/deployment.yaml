apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: shopsphere
spec:
  replicas: 2
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      containers:
        - name: order-service
          image: shopsphere/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4003
          env:
            - { name: PORT, value: "4003" }
            - { name: MONGO_URI, value: "mongodb://mongo:27017/orderdb" }
            - { name: JWT_SECRET, value: "supersecretjwtkey" }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: shopsphere
spec:
  selector: { app: order-service }
  ports:
    - { port: 4003, targetPort: 4003 }