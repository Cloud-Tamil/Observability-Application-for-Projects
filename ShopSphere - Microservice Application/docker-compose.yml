services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the DB host is `db`.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      PORT: 4000
      NODE_ENV: production
      # Seed demo data on first boot. Safe: uses upserts.
      SEED_ON_START: "true"
      # The web container proxies /api so the browser never hits :4000 directly.
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  web:
    build:
      context: ./web
      args:
        # Empty → the SPA uses relative URLs, nginx proxies /api → server:4000
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  db_data:
